[project]
name = "rotasat"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network and not browser'"
markers = [
    "network: consulta los servicios reales (pytest -m network)",
    "browser: abre la app en Chrome o Edge sin ventana (pytest -m browser)",
]
